name: YouTube free lane (feed + publication check)
on:
  schedule:
    - cron: "41 * * * *"   # hourly
  workflow_dispatch:
  push:
    paths: ["yt/ledger.json", "yt/yt_api.py", "yt/yt_feed.py", "yt/fit_make.py", ".github/workflows/yt-feed.yml"]
permissions:
  contents: write
concurrency: yt-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: |
          git config user.name "yt-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3; do
            # Errors go to yt/error.log (committed) so the monitor can read them; GitHub log storage
            # is not reachable from Claude's sandbox, which is why failures went unseen from 10 Oct.
            : > yt/error.log
            python3 yt/fit_make.py 2>>yt/error.log || echo "fit_make.py exit $? at $(date -u +%FT%TZ)" >> yt/error.log
            python3 yt/yt_feed.py 2>>yt/error.log || echo "yt_feed.py exit $? at $(date -u +%FT%TZ)" >> yt/error.log
            git add -A yt 0* pilots 2>/dev/null || git add -A yt
            git commit -qm "YouTube lane: feed/publication update $(date -u +%F)" || { echo "no change"; exit 0; }
            git pull --rebase -q && git push && exit 0
            git rebase --abort 2>/dev/null; git fetch -q && git reset -q --hard origin/main; sleep 5
          done
          exit 1
