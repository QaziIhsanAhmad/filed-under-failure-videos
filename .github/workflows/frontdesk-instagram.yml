name: FrontDesk Flows Instagram feed

# Every hour, rebuild frontdesk-ig/feed.xml from frontdesk-ig/queue/.
# Make.com watches the feed and posts new items to @frontdeskflows.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    paths: ["frontdesk-ig/queue/**", "frontdesk-ig/build_feed.py"]

permissions:
  contents: write

concurrency:
  group: frontdesk-instagram
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python frontdesk-ig/build_feed.py
      - run: |
          git config user.name "frontdesk-ig-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontdesk-ig/feed.xml
          git commit -m "Instagram feed: update" || exit 0
          git pull --rebase -q && git push
