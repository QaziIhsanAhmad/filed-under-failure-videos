name: YouTube lane - fetch thumbnails of given video IDs
on:
  workflow_dispatch:
    inputs:
      ids: {description: "space-separated video IDs", required: true}
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p yt/thumbs
          for v in ${{ inputs.ids }}; do curl -sSfL -o yt/thumbs/$v.jpg https://i.ytimg.com/vi/$v/hqdefault.jpg || echo "fail $v" >> yt/thumbs/errors.txt; done
          git config user.name "yt-feed-bot"; git config user.email "actions@users.noreply.github.com"
          git add yt/thumbs; git commit -qm "YouTube lane: thumbnails" || exit 0
          for n in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep 7; done; exit 1
