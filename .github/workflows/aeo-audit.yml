name: AEO audit (xenovasolutions.com)
on:
  schedule:
    - cron: "17 3 1 * *"   # 1st of each month, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          d=$(date -u +%Y-%m)
          python aeo/aeo_audit.py https://xenovasolutions.com --max 150 --out aeo/reports/$d
          cp aeo/reports/$d.json aeo/reports/latest.json
          cp aeo/reports/$d.html aeo/reports/latest.html
      - run: |
          git config user.name "aeo-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add aeo/reports
          git commit -m "AEO audit $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
