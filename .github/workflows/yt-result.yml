name: YouTube lane - record Make upload result
on:
  repository_dispatch:
    types: [yt-uploaded, yt-failed]
permissions:
  contents: write
concurrency: yt-feed
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "yt-feed-bot"; git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3 4; do
            python3 yt/yt_result.py
            git add yt; git commit -qm "YouTube lane: Make result ${{ github.event.action }}" || { echo none; exit 0; }
            git pull --rebase -q && git push && exit 0
            git rebase --abort 2>/dev/null; git fetch -q && git reset -q --hard origin/main; sleep 7
          done
          exit 1
