name: YouTube lane - upload into Make session (any size)
on:
  repository_dispatch:
    types: [yt-session]
permissions:
  contents: write
# No shared concurrency group: Make sends several sessions at once and each run writes its own
# yt/results/<id>.json, so runs never conflict (a shared group made GitHub cancel queued runs).
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            yt
            ${{ github.event.client_payload.file }}
          sparse-checkout-cone-mode: false
      - run: |
          git config user.name "yt-feed-bot"; git config user.email "actions@users.noreply.github.com"
          python3 yt/yt_upload.py
          mkdir -p /tmp/res && cp yt/results/*.json /tmp/res/ 2>/dev/null || exit 0
          # Only this run's own file changes, so on a race: reset to the latest main and re-apply it.
          for n in $(seq 1 25); do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p yt/results && cp -n /tmp/res/*.json yt/results/ 2>/dev/null
            git add yt/results
            git diff --cached --quiet && exit 0
            git commit -qm "YouTube lane: upload result ${{ github.event.client_payload.id }}"
            git push -q origin HEAD:main && exit 0
            sleep $((3 + RANDOM % 20))
          done
          exit 1
